<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f6f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15241e" media="(prefers-color-scheme: dark)" />
    <title>Speech and audio — weights and wires</title>
    <meta
      name="description"
      content="A hands-on speech and audio course, with an editor, a check runner, audio playback, and interactive demos beside every lesson."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231d4939'/%3E%3Cg fill='%23f7f6f0'%3E%3Ccircle cx='6.5' cy='7.5' r='2'/%3E%3Ccircle cx='6.5' cy='16.5' r='2'/%3E%3Ccircle cx='17.5' cy='12' r='2.2'/%3E%3C/g%3E%3Cpath d='M8.3 8.3 15.6 11.3M8.3 15.7 15.6 12.7' stroke='%23f7f6f0' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the stored theme before the first paint. src/lib/theme.ts owns
      // the same key and keeps it in step afterwards.
      (function () {
        var mode = null;
        try {
          mode = localStorage.getItem("speech.theme");
        } catch (e) {}
        var dark =
          mode === "dark" ||
          (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
