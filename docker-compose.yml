# The speech and audio course app.
#
# Caddy on this host terminates TLS and proxies to speech:8000 over the shared
# `edge` network, the same way the other services here are reached. This bundle
# must never publish 80 or 443 itself.
#
#   docker compose up -d
#
# This is an example. GitHub Actions builds the image on every merge to main and
# pushes it to ghcr.io/weights-and-wires/speech; the VM runs `deploy speech`,
# which pulls the new image and restarts the container. The image carries the
# PDF book, so no book folder is mounted.

name: speech

services:
  app:
    image: ghcr.io/weights-and-wires/speech:latest
    container_name: speech
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      # Localhost only. Caddy reaches the container over `edge`, so this is not
      # a route in from outside; it exists so the app can be reached through an
      # SSH tunnel before its DNS record resolves:
      #   ssh -L 8096:127.0.0.1:8096 ifkash@vm.ifkash.dev
      - "127.0.0.1:8096:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      # Set here so this example overrides env_file.
      LOCAL_WORKERS: "1"
    volumes:
      - speech-data:/data
    networks:
      - edge
    # A reader's submission is a subprocess inside this container, so cap what
    # the container as a whole can take from the host. This service shares the
    # VM with the other courses, so it gets 1 GiB and one local worker.
    cpus: 1.5
    mem_limit: 1g
    pids_limit: 512
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  speech-data:

networks:
  edge:
    external: true
