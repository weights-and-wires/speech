name: Check the content

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the exercises import
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pyyaml soundfile
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Validate every lesson and exercise
        run: python scripts/check_content.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Compile every lesson's math with KaTeX
        run: node scripts/check_math.mjs

      - name: Test the demos' signal processing
        run: npm test
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the loader's dependencies
        run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: frontend

      # Fails on maths KaTeX can't render and on anything wider than the page,
      # either of which would make a page of the book wrong.
      - name: Build the PDF book
        run: node frontend/scripts/build-book.mjs --force
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PYTHON: python

      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: book/*.pdf
          retention-days: 7
